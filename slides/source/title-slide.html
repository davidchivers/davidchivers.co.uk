<section id="title-slide" class="title-slide induction-cover">
  <div class="cover-orbit cover-orbit-outer" aria-hidden="true"></div>
  <div class="cover-orbit cover-orbit-inner" aria-hidden="true"></div>
  <div class="cover-copy">
    <p class="cover-university">Durham University</p>
    <div class="cover-accent" aria-hidden="true"></div>
    <h1 class="title">$title$<span class="cover-full-stop">.</span></h1>
    <p class="cover-subtitle">$subtitle$</p>
  </div>
  <div class="cover-emblem">
    <img class="cover-shield" src="assets/durham_shield.svg" alt="Durham University shield" />
    <p class="cover-year">Quarto</p>
    <p class="cover-year-label">Slides for teaching</p>
  </div>
  <div class="cover-presenter">
    $for(author)$<p class="cover-author">$author$</p>$endfor$
    $for(institute)$<p class="cover-department">$institute$</p>$endfor$
  </div>
</section>
