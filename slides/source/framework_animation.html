<script>
// Optional playback of slide 7. The full diagram is the default and fallback.
function initialiseFrameworkAnimation() {
  document.querySelectorAll('.framework-widget').forEach(function (widget) {
    if (widget.dataset.initialised) return;
    widget.dataset.initialised = 'true';
    var diagram = widget.querySelector('.fw-diagram');
    var flows = Array.from(widget.querySelectorAll('.fw-flow'));
    var nodes = Array.from(widget.querySelectorAll('.fw-node'));
    var status = widget.querySelector('.fw-status');
    var play = widget.querySelector('[data-action="play"]');
    var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    var messages = [
      'Good 1: Home imports from Partner and RoW.',
      'Good 2: Partner imports from Home and RoW.',
      'Good 3: RoW imports from Home and Partner.'
    ];
    var importers = ['Home', 'Partner', 'RoW'];
    var summary = status.textContent;
    var phase = -1, elapsed = 0, lastTime = null, frame = null, playing = false;
    var duration = 3000;
    flows.forEach(function (flow) {
      var route = flow.querySelector('.fw-route');
      flow.routeLength = route.getTotalLength();
    });

    function stopClock() {
      if (frame !== null) window.cancelAnimationFrame(frame);
      frame = null;
      lastTime = null;
      playing = false;
      diagram.dataset.playing = 'false';
    }
    function button(label, accessibleLabel) {
      play.textContent = label;
      play.setAttribute('aria-label', accessibleLabel);
    }
    function showGood(index) {
      phase = index;
      diagram.dataset.good = String(index + 1);
      diagram.classList.add('has-focus');
      flows.forEach(function (flow) {
        flow.classList.toggle('is-active', Number(flow.dataset.good) === index + 1);
      });
      nodes.forEach(function (node) {
        node.classList.toggle('is-active', node.dataset.country === importers[index]);
      });
      status.textContent = messages[index];
    }
    function positionMarkers() {
      // One passage per good, followed by a brief hold at the importing country.
      var progress = Math.min(elapsed / 2200, 1);
      flows.filter(function (flow) { return flow.classList.contains('is-active'); }).forEach(function (flow) {
        var point = flow.querySelector('.fw-route').getPointAtLength(flow.routeLength * progress);
        var marker = flow.querySelector('.fw-particle');
        marker.setAttribute('cx', point.x);
        marker.setAttribute('cy', point.y);
      });
    }
    function showAll(completed) {
      stopClock();
      phase = -1;
      elapsed = 0;
      diagram.dataset.good = 'all';
      diagram.classList.remove('has-focus', 'has-motion');
      flows.forEach(function (flow) { flow.classList.remove('is-active'); });
      nodes.forEach(function (node) { node.classList.remove('is-active'); });
      status.textContent = summary;
      button(completed ? '↻ Replay' : '▶ Play', completed ? 'Replay trade flows' : 'Play trade flows');
    }
    function tick(time) {
      if (!playing) return;
      if (lastTime !== null) elapsed += time - lastTime;
      lastTime = time;
      if (elapsed >= duration) {
        elapsed -= duration;
        if (phase === 2) { showAll(true); return; }
        showGood(phase + 1);
      }
      positionMarkers();
      frame = window.requestAnimationFrame(tick);
    }
    function pause() {
      stopClock();
      button('▶ Resume', 'Resume trade flows');
    }
    play.addEventListener('click', function () {
      if (playing) { pause(); return; }
      if (phase < 0) { elapsed = 0; showGood(0); }
      playing = true;
      diagram.dataset.playing = 'true';
      diagram.classList.toggle('has-motion', !reducedMotion.matches);
      button('Ⅱ Pause', 'Pause trade flows');
      positionMarkers();
      frame = window.requestAnimationFrame(tick);
    });
    widget.querySelector('[data-action="step"]').addEventListener('click', function () {
      stopClock();
      elapsed = 0;
      diagram.classList.remove('has-motion');
      showGood((phase + 1) % 3);
      button('▶ Play', 'Play trade flows');
    });
    widget.querySelector('[data-action="all"]').addEventListener('click', function () { showAll(false); });
    widget.querySelector('.fw-controls').hidden = false;
    if (window.Reveal) Reveal.on('slidechanged', function (event) {
      if (event.previousSlide && event.previousSlide.contains(widget)) showAll(false);
    });
    document.addEventListener('durham:staff-edit-mode', function (event) {
      if (event.detail.active) showAll(false);
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && playing) pause();
    });
    reducedMotion.addEventListener('change', function () {
      diagram.classList.toggle('has-motion', playing && !reducedMotion.matches);
    });
  });
}
window.addEventListener('load', initialiseFrameworkAnimation);
</script>
